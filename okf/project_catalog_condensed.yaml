- title: ZALF Root Trait & Soil Isotope Research (RhizoTraits and ErosioN Projects)
  description: Research assistant work at the Leibniz Centre for Agricultural Landscape Research (ZALF), Isotope Biogeochemistry and Gas Fluxes group, on root traits and soil erosion effects.
  technologies: ImageJ, Microsoft Excel (Pivot Tables), root sampling, soil sampling, 15N isotope sample preparation
  archetypes:
