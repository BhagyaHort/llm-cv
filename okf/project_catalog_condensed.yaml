- title: 'Seminar Research: Health Impacts of Environmental Contaminants in Plant Foods'
  description: Systematic literature review (Seminar Horticulture, Humboldt-Universität zu Berlin) on contamination of plant-based foods by heavy metals, pesticides, persistent organic pollutants and pathogens, and on detection and prevention methods.
  technologies: Systematic literature review (Google Scholar, ScienceDirect), thematic analysis, inclusion/exclusion criteria, food contaminant analytics overview (mass spectrometry, chromatography)
  archetypes:
  - Quality Control & Food Safety
  - Plant Research & Experiments
  business_problem: Synthesising peer-reviewed evidence on how environmental contaminants (e.g. cadmium, lead, pesticide residues, POPs, E. coli) reach plant foods, their health effects, and which analytical and preventive measures control them.
  key_metrics: Peer-reviewed papers published 2018-2022 selected by explicit inclusion/exclusion criteria; two thematic analyses (causes of contamination; preventive measures); 23-page report; seminar module grade 2.7
  transferable_skills:
  - literature review
  - research synthesis
  - food safety
  - contaminant analysis
  - risk assessment
