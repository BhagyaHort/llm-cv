projects:
- title: 'Master''s Thesis: Antihyperglycemic Potential of Costus pictus (Insulin Plant)'
  description: Master's thesis at Humboldt-Universität zu Berlin on the medicinal insulin plant Costus pictus, within an international collaboration with the Indian Institute of Technology on plant-based approaches to metabolic health.
  technologies: Plant cultivation under varying light regimes, sample collection and preparation, plant extraction, analytical procedures, quantitative and qualitative data analysis, phytochemical profiling
  archetypes:
  - Plant Research & Experiments
  - Hydroponics & Controlled-Environment Agriculture
  business_problem: Investigating how light regime affects growth and secondary metabolites of Costus pictus, and the plant's phytochemical profile and biological activity for therapeutic (antihyperglycemic) applications.
  key_metrics: International collaboration with the Indian Institute of Technology; multi-site experimental data integration; thesis in progress (programme completes 05/2027)
