# Project name normalization rules — loaded by obsidian_sync_core.normalize_project()
#
# junk_patterns:
#   Strings that indicate a junk entry (return empty string so caller can skip).
#   Checked with startswith on the lowercased, cleaned project name.
#
# rules:
#   List of {keywords, canonical} evaluated in order; first match wins.
#   ALL keywords must be present (as substrings) in the lowercased project name.
#   Order matters — more specific patterns should come first.
#
# Canonical names MUST equal the `title` fields in project_catalog.yaml.

junk_patterns:
  - "generated by:"
  - "query:"
  - "install"

rules:
  # --- Master's thesis ---
  - keywords: ["costus"]
    canonical: "Master's Thesis: Antihyperglycemic Potential of Costus pictus (Insulin Plant)"
  - keywords: ["insulin", "plant"]
    canonical: "Master's Thesis: Antihyperglycemic Potential of Costus pictus (Insulin Plant)"
  - keywords: ["master", "thesis"]
    canonical: "Master's Thesis: Antihyperglycemic Potential of Costus pictus (Insulin Plant)"
  - keywords: ["masterarbeit"]
    canonical: "Master's Thesis: Antihyperglycemic Potential of Costus pictus (Insulin Plant)"

  # --- FYTA ---
  - keywords: ["fyta"]
    canonical: "Working Student, Plant Experiments & Product Development (FYTA)"
  - keywords: ["plant", "experiments", "product development"]
    canonical: "Working Student, Plant Experiments & Product Development (FYTA)"

  # --- ZALF ---
  - keywords: ["zalf"]
    canonical: "ZALF Root Trait & Soil Isotope Research (RhizoTraits and ErosioN Projects)"
  - keywords: ["rhizotraits"]
    canonical: "ZALF Root Trait & Soil Isotope Research (RhizoTraits and ErosioN Projects)"
  - keywords: ["erosion", "isotope"]
    canonical: "ZALF Root Trait & Soil Isotope Research (RhizoTraits and ErosioN Projects)"

  # --- Our Greenery ---
  - keywords: ["our greenery"]
    canonical: "Hydroponics Food Safety & Quality (Our Greenery GmbH Internship)"
  - keywords: ["hydroponic", "food safety"]
    canonical: "Hydroponics Food Safety & Quality (Our Greenery GmbH Internship)"
  - keywords: ["microgreens"]
    canonical: "Hydroponics Food Safety & Quality (Our Greenery GmbH Internship)"

  # --- Seminar research ---
  - keywords: ["environmental contaminants"]
    canonical: "Seminar Research: Health Impacts of Environmental Contaminants in Plant Foods"
  - keywords: ["contaminants", "plant foods"]
    canonical: "Seminar Research: Health Impacts of Environmental Contaminants in Plant Foods"
  - keywords: ["seminar", "horticulture"]
    canonical: "Seminar Research: Health Impacts of Environmental Contaminants in Plant Foods"

  # --- RAWE ---
  - keywords: ["rawe"]
    canonical: "Rural Agricultural Work Experience (RAWE) Programme, TNAU"
  - keywords: ["rural agricultural work experience"]
    canonical: "Rural Agricultural Work Experience (RAWE) Programme, TNAU"
  - keywords: ["krishi vigyan"]
    canonical: "Rural Agricultural Work Experience (RAWE) Programme, TNAU"
  - keywords: ["sakthe"]
    canonical: "Rural Agricultural Work Experience (RAWE) Programme, TNAU"
